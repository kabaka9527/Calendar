name: Build and Pre-release APK

on:
  push:
    branches: [trae/agent-EUzjd0]
  pull_request:
    branches: [trae/agent-EUzjd0]
  workflow_dispatch:

jobs:
  build:
    name: Build, Sign & Pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 发布 release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
          add-job-summary: 'never'

      - name: Generate Gradle wrapper
        working-directory: ShiftCalendar
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: ShiftCalendar
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        working-directory: ShiftCalendar
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ShiftCalendar/app/build/outputs/apk/release/app-release.apk

      - name: Run unit tests
        working-directory: ShiftCalendar
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ShiftCalendar/app/build/reports/tests/

      # 构建成功后发布预发行版（PR 不发版，避免 PR 触发污染 release）
      - name: Publish prerelease
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')

          # 重命名 APK，附短 SHA 便于辨识
          ASSET="/tmp/ShiftCalendar-prerelease-${SHORT_SHA}.apk"
          cp ShiftCalendar/app/build/outputs/apk/release/app-release.apk "$ASSET"

          # 删除已有的滚动 prerelease 标签与 release（若存在），实现"更新同一个 tag"
          gh release delete prerelease --yes --cleanup-tag 2>/dev/null || true

          # 创建新的预发行版
          gh release create prerelease \
            "$ASSET" \
            --title "ShiftCalendar 预发行版 (${SHORT_SHA})" \
            --notes "自动构建于 ${BUILD_TIME}，commit [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})。" \
            --prerelease \
            --latest=false \
            --target trae/agent-EUzjd0

          echo "::notice::预发行版已发布: ${{ github.server_url }}/${{ github.repository }}/releases/tag/prerelease"
