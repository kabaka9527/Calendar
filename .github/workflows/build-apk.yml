name: Build APK

on:
  push:
    branches: [trae/agent-EUzjd0]
  pull_request:
    branches: [trae/agent-EUzjd0]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
          add-job-summary: 'never'

      - name: Generate Gradle wrapper
        working-directory: ShiftCalendar
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: ShiftCalendar
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ShiftCalendar
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ShiftCalendar/app/build/outputs/apk/release/app-release.apk

      - name: Run unit tests
        working-directory: ShiftCalendar
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ShiftCalendar/app/build/reports/tests/